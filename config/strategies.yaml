# Sakata-inspired pilot replaces RSI as active scan strategy.
strategies:
  - id: sakata_three_soldiers
    enabled: true
    params:
      prior_trend_bars: 5
      prior_decline_min_pct: 2.0
      min_body_to_range: 0.5
      max_upper_shadow_to_range: 0.25
  - id: sakata_morning_star
    enabled: false
    params:
      prior_trend_bars: 5
      prior_decline_min_pct: 2.0
      first_body_to_range_min: 0.6
      star_to_first_body_max: 0.3
      third_body_to_range_min: 0.5
      third_recovery_of_first_body_min: 0.5
  - id: sakata_evening_star
    enabled: false
    params:
      prior_trend_bars: 5
      prior_rise_min_pct: 2.0
      first_body_to_range_min: 0.6
      star_to_first_body_max: 0.3
      third_body_to_range_min: 0.5
      third_reversal_of_first_body_min: 0.5
  - id: sakata_black_three_crows
    enabled: false
    params:
      prior_trend_bars: 5
      prior_rise_min_pct: 2.0
      min_body_to_range: 0.5
      max_lower_shadow_to_range: 0.25
  - id: sakata_rising_three_methods
    enabled: false
    params: &three_methods_params
      prior_trend_bars: 5
      prior_trend_min_pct: 2.0
      impulse_body_to_range_min: 0.6
      middle_body_to_first_body_max: 0.5
      final_body_to_range_min: 0.5
  - id: sakata_falling_three_methods
    enabled: false
    params: *three_methods_params
  - id: sakata_three_gaps_up
    enabled: false
    params: &gaps
      prior_trend_bars: 5
      prior_trend_min_pct: 2.0
      minimum_full_gap_pct: 0.2
  - id: sakata_three_gaps_down
    enabled: false
    params: *gaps
  - id: sakata_three_mountains_triple_top
    enabled: false
    params: &peaks
      pivot_side_bars: 2
      prior_trend_bars: 5
      prior_rise_min_pct: 2.0
      peak_tolerance_pct: 5.0
      min_peak_separation_bars: 3
      max_pattern_bars: 90
      neckline_break_min_pct: 0.2
  - id: sakata_three_mountains_head_shoulders
    enabled: false
    params: *peaks
  - id: rsi_volume
    enabled: false
    params:
      rsi_period: 14
      rsi_max: 30.0
      volume_window: 20
      volume_ratio_min: 2.0
  - id: ma_breakout
    enabled: false
    params:
      ma_window: 20
