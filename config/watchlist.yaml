# 衛星個股設定（#111、#114、#115）。掃描標的只由 markets.yaml 決定；這裡的標的必須是
# markets.yaml tw 掃描標的的子集，且不可是 ETF／ETN（00 開頭只看行情）。
#
# thesis：持有論點文字，論點檢查時一併顯示；尚未填寫時為 null。
# valuation_zone（可省略，預設 percentiles: [20, 50, 80]），兩者擇一：
#   percentiles：近 5 年每日本益比（FinMind TaiwanStockPER）的三個遞增百分位
#   pe_multiples：固定的三個遞增本益比倍數，取代歷史百分位
# 價位 = 本益比 × 近四季 EPS。結果是「檢視區」提醒，不是買賣建議。
# revenue_check（可省略，#115 論點檢查）：
#   consecutive_months：連續幾個月（1–12，預設 3）
#   yoy_below_pct：月營收年增率低於此百分比（預設 0）
#   連續 consecutive_months 個月的年增率都低於 yoy_below_pct 時，論點狀態為「請檢視」；
#   當日有 TWSE 重大公告也會標為「請檢視」。
# 論點依據：2026-10 Alphabet、Amazon、Intel、Microsoft、Meta 財報與記憶體漲價（#133）；
# Sandisk FY27 Q1（2026-10-29 8-K 與法說會）。
# 「媒體報導」的客戶關係未經公司證實。系統每天自動檢查的只有月營收年增率與重大公告，
# 其餘失效條件需人工判斷。
satellites:
  2330.TW:
    thesis: >-
      AI 加速器（NVIDIA GPU、Google TPU、Amazon Trainium 等 ASIC）集中在台積電先進製程與 CoWoS；
      Alphabet、Amazon 2026 年資本支出約 2,000、2,200 億美元，Alphabet 表示 2027 年將大幅增加。
      記憶體漲價吃掉部分資本支出，HBM 供給是加速器出貨上限。
      失效條件：雲端大廠下修資本支出、先進製程或 CoWoS 稼動率下滑、Intel 18A／14A 取得主要 AI 晶片客戶、月營收年增率連續轉負。
  2317.TW:
    thesis: >-
      AI 伺服器（以 NVIDIA 機櫃為主，並爭取 Google TPU 組裝）推升營收規模；記憶體成本轉嫁會放大營收但稀釋毛利率，
      記憶體漲價也壓抑手機與 PC 組裝需求。
      失效條件：AI 伺服器出貨遞延、毛利率持續下滑、月營收年增率連續轉負。
  2454.TW:
    thesis: >-
      第一顆 AI 加速器 ASIC 於 2026 Q4 量產（客戶為 Google TPU 屬媒體報導），2026 年資料中心營收逾 20 億美元，
      2027 年目標在 800 億美元市場取得 15–20%，帶動由手機晶片公司重新評價。記憶體漲價壓抑手機出貨與規格，
      資料中心成長需抵銷手機本業的下滑。Sandisk 稱 Edge 市場高階與主流具韌性、低階萎縮，
      聯發科低階手機晶片比重較高，受影響可能大於高階同業（推論）。
      失效條件：ASIC 量產遞延或客戶轉單、2027 年資料中心營收指引下修、手機本業月營收連續衰退。
  2356.TW:
    thesis: >-
      Google TPU 伺服器主要代工夥伴（媒體報導），AI 伺服器占伺服器營收過半（公司說法），
      並受惠 Intel 所稱的一般伺服器（Xeon）強勁需求；Sandisk 稱推論與 agent 編排的 NAND 需求跟著 CPU 走
      （每顆約 60–90 GB）。記憶體成本轉嫁使營收放大、毛利率偏低（近四季約 4.8%），
      筆電業務受記憶體短缺影響，Sandisk 預期 PC 出貨今年衰退、明年小幅衰退。
      失效條件：TPU 伺服器份額流失、一般伺服器需求轉弱、月營收年增率連續轉負。
  3017.TW:
    thesis: >-
      AI 伺服器液冷滲透率提升（公司預估 2027 年達 50%），同時受惠 ASIC 與 GPU 平台；出貨隨機櫃數成長，
      不受記憶體成本轉嫁影響，毛利率由 26% 升至近 33%。估值已高於自身近 5 年本益比區間（重新評價）。
      失效條件：液冷導入遞延、毛利率回落、月營收年增率連續轉負。

# 產業觀察層（#141、#142）：追蹤一個產業的景氣，和衛星股、核心 ETF 分開。
# 不跑 scan、公司研究與論點檢查；每天只看價格位置（算法同核心 ETF）與股價淨值比檢視區：
#   價位 = 近 5 年每日 PBR（FinMind TaiwanStockPER）百分位 × 每股淨值（收盤 ÷ 同日 PBR）。
# 景氣循環股獲利高峰時本益比最低，所以用 PBR，不用本益比。結果是「檢視區」提醒，不是買賣建議。
#   <群組 id>：
#     name：群組名稱；rationale：觀察理由（附來源與日期）
#     symbols：代號 → 公司名稱；代號以 .TW 結尾，不可是 ETF，也不可出現在
#              markets.yaml 的掃描清單或上方的衛星股
#     pb_zone（可省略）：percentiles 三個遞增百分位，預設 [20, 50, 80]
industry_watch:
  memory:
    name: 記憶體
    rationale: >-
      Sandisk FY27 Q1（2026-10-29 8-K 與法說會）：長約（NBM）約占 FY27 bit 的 50%、FY28 的 2/3，
      資料中心營收季增 61%，公司稱長約洽談量到本世紀末都超過供給。南亞科 2026-03 私募由 Sandisk、
      Kioxia、Solidigm、Cisco 認購（TrendForce 2026-03-26）。2026-10-30 記憶體股營收年增率仍在三位數，
      股價已比 2026 年高點低 16–26%：要追蹤的是這一波景氣會不會像 Sandisk 說的那麼長。
    symbols:
      2408.TW: 南亞科
      2344.TW: 華邦電
      8299.TWO: 群聯
