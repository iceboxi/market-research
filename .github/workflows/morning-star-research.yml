name: Morning Star isolated research
# Shared verified snapshots: no market CSV is uploaded to the public repository.
# Rerun after zero-range OHLC compatibility fix.
on:
  push:
    paths:
      - 'scripts/morning_star_research.py'
      - 'tests/test_morning_star_research.py'
      - '.github/workflows/morning-star-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    strategy:
      matrix:
        market: [tw, us]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv lock --check
      - run: uv sync --extra dev --locked
      - run: uv run --no-sync pytest
      - name: Execute isolated one-year Morning Star research
        run: uv run --no-sync python -m scripts.morning_star_research --market "${{ matrix.market }}" --period 1y --out research_output
      - name: Research summary
        if: always()
        run: |
          if [ -f research_output/study.md ]; then cat research_output/study.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Publish reports without vendor OHLCV snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-star-${{ matrix.market }}-${{ github.run_id }}
          path: research_output/
          if-no-files-found: warn
          retention-days: 14
