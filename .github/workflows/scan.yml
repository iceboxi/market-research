name: EOD market scan
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/scan.yml'
  workflow_dispatch:
    inputs:
      market:
        description: Market
        type: choice
        required: true
        default: both
        options: [tw, us, both]
  schedule:
    - cron: '30 11 * * 1-5'
    - cron: '45 0 * * 2-6'
permissions:
  contents: write
  issues: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SCAN_MARKET: ${{ github.event_name == 'schedule' && (github.event.schedule == '30 11 * * 1-5' && 'tw' || 'us') || inputs.market || 'both' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv lock --check
      - run: uv sync --extra dev --locked
      - run: uv run --no-sync pytest
      - name: Fetch actual daily market prices and screen
        id: scan
        run: uv run --no-sync market-scan --market "$SCAN_MARKET" --period 6mo --check-twse --strict-freshness --out output
      - name: Emit health report on success or failure
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: python3 scripts/monitor.py report --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --event "$GITHUB_EVENT_NAME" --market "$SCAN_MARKET" --outcome "$SCAN_OUTCOME" --out output
      - name: Add job summary
        if: always()
        run: |
          if [ -f output/summary.md ]; then cat output/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f output/health_report.md ]; then cat output/health_report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-scan-${{ env.SCAN_MARKET }}-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
      - name: Candidate company research from verified scan
        id: candidate_research
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.scan.outcome == 'success'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: uv run --no-sync python -m scripts.scan_company_research --scan-dir output --out output/candidate_research --max-candidates 3
      - name: Candidate research summary
        if: always()
        run: |
          if [ -f output/candidate_research/candidate_summary.md ]; then
            cat output/candidate_research/candidate_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload candidate company reports
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: candidate-research-${{ env.SCAN_MARKET }}-${{ github.run_id }}
          path: output/candidate_research/
          retention-days: 14
          if-no-files-found: ignore
      - name: Archive compact history
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: python3 scripts/monitor.py archive --report output/health_report.json --receipt output/state_receipt.json
      - name: Upload history persistence receipt
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: health-state-${{ github.run_id }}
          path: output/state_receipt.json
          retention-days: 14
          if-no-files-found: error
      - name: Sync incident Issue
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/monitor.py alert --report output/health_report.json --repo "$GITHUB_REPOSITORY"
      - name: Collect prospective research observations
        if: github.event_name == 'schedule' && steps.scan.outcome == 'success'
        run: uv run --no-sync python -m scripts.prospective_observe --market "$SCAN_MARKET" --health output/health_report.json --out prospective_receipt.json
      - name: Archive immutable prospective observation receipt
        if: github.event_name == 'schedule' && steps.scan.outcome == 'success'
        run: python3 scripts/prospective_archive.py --receipt prospective_receipt.json
      - name: Upload prospective metadata receipt
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: prospective-${{ env.SCAN_MARKET }}-${{ github.run_id }}
          path: prospective_receipt.json
          if-no-files-found: ignore
          retention-days: 14
