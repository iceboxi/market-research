name: EOD market scan
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/daily_research.py'
      - 'scripts/scan_company_research.py'
      - 'scripts/research_publication.py'
      - '.github/workflows/scan.yml'
  workflow_dispatch:
    inputs:
      market:
        description: Market
        type: choice
        required: true
        default: both
        options: [tw, us, both]
  schedule:
    # TW 15:40 Asia/Taipei: TWSE STOCK_DAY already had the same-day session at 15:15
    # (push run 39214871920); GitHub schedule delay adds hours on top of this slot.
    - cron: '40 7 * * 1-5'
    - cron: '45 0 * * 2-6'
permissions:
  contents: write
  issues: write
jobs:
  scan:
    concurrency:
      group: ${{ ((github.event_name == 'workflow_dispatch' && inputs.market != 'us') || (github.event_name == 'schedule' && github.event.schedule != '45 0 * * 2-6')) && (github.ref == 'refs/heads/main' && 'research-publication-production' || 'research-state-validation') || format('scan-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      pages_ready: ${{ steps.pages_site.outputs.ready }}
    env:
      PROSPECTIVE_STATE_MODE: ${{ vars.PROSPECTIVE_STATE_MODE || 'legacy' }}
      SCAN_MARKET: ${{ github.event_name == 'schedule' && (github.event.schedule == '45 0 * * 2-6' && 'us' || 'tw') || inputs.market || 'both' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv lock --check
      - run: uv sync --extra dev --locked
      - run: uv run --no-sync pytest
      - name: Fetch actual daily market prices and screen
        id: scan
        run: uv run --no-sync market-scan --market "$SCAN_MARKET" --period 6mo --check-twse --strict-freshness --out output
      - name: Emit health report on success or failure
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: python3 scripts/monitor.py report --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --event "$GITHUB_EVENT_NAME" --market "$SCAN_MARKET" --outcome "$SCAN_OUTCOME" --out output
      - name: Add job summary
        if: always()
        run: |
          if [ -f output/summary.md ]; then cat output/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f output/health_report.md ]; then cat output/health_report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-scan-${{ env.SCAN_MARKET }}-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
      - name: Fixed TW research and verified scan candidates
        id: candidate_research
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (steps.scan.outcome == 'success' || (env.SCAN_MARKET != 'us' && steps.scan.outcome == 'failure'))
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GH_TOKEN: ${{ github.token }}
          RESEARCH_PUBLICATION_MODE: ${{ github.ref == 'refs/heads/main' && 'production' || 'validation' }}
        run: |
          if [ "$SCAN_MARKET" = us ]; then
            uv run --no-sync python -m scripts.scan_company_research --scan-dir output --out output/candidate_research --max-candidates 3
          else
            uv run --no-sync python -m scripts.daily_research --scan-dir output --out output/candidate_research --market "$SCAN_MARKET" --mode "$RESEARCH_PUBLICATION_MODE" --max-candidates 3 --pilot
          fi
      - name: Candidate research summary
        if: always()
        run: |
          if [ -f output/candidate_research/daily_summary.md ]; then
            cat output/candidate_research/daily_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f output/candidate_research/candidate_summary.md ]; then
            cat output/candidate_research/candidate_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload candidate company reports
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: candidate-research-${{ env.SCAN_MARKET }}-${{ github.run_id }}
          path: output/candidate_research/
          retention-days: 14
          if-no-files-found: ignore
      - name: Prepare daily research site for Pages
        id: pages_site
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.SCAN_MARKET != 'us' && steps.candidate_research.outcome != 'skipped'
        run: |
          # Same renderer and research-state records as the manual production
          # publication; deploy only after the fixed report was published.
          site=output/candidate_research/fixed_research/index.html
          status=$(jq -r '.fixed_research.publication.status // empty' output/candidate_research/daily_receipt.json 2>/dev/null || true)
          if [ -f "$site" ] && { [ "$status" = published ] || [ "$status" = already_current ]; }; then
            mkdir -p _site
            cp "$site" _site/index.html
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "研究網站未更新：固定發布狀態 ${status:-missing}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload daily research site for Pages
        if: always() && steps.pages_site.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Archive compact history
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: python3 scripts/monitor.py archive --report output/health_report.json --receipt output/state_receipt.json
      - name: Upload history persistence receipt
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: health-state-${{ github.run_id }}
          path: output/state_receipt.json
          retention-days: 14
          if-no-files-found: error
      - name: Sync incident Issue
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/monitor.py alert --report output/health_report.json --repo "$GITHUB_REPOSITORY"
      - name: Verify exclusive prospective writer after migration
        if: github.event_name == 'schedule' && steps.scan.outcome == 'success'
        run: uv run --no-sync python -m scripts.prospective_cutover_guard --mode "$PROSPECTIVE_STATE_MODE"
      - name: Collect prospective research observations
        if: github.event_name == 'schedule' && steps.scan.outcome == 'success'
        run: |
          if [ "$PROSPECTIVE_STATE_MODE" = canonical ]; then
            uv run --no-sync python -m scripts.prospective_observe --market "$SCAN_MARKET" --health output/health_report.json --out prospective_receipt.json --revision-pinned
          elif [ "$PROSPECTIVE_STATE_MODE" = legacy ]; then
            uv run --no-sync python -m scripts.prospective_observe --market "$SCAN_MARKET" --health output/health_report.json --out prospective_receipt.json
          else
            echo 'Unsupported prospective state mode. Refusing archive.' >&2
            exit 1
          fi
      - name: Archive immutable prospective observation receipt (legacy)
        if: github.event_name == 'schedule' && steps.scan.outcome == 'success' && env.PROSPECTIVE_STATE_MODE == 'legacy'
        run: python3 scripts/prospective_archive.py --receipt prospective_receipt.json
      - name: Archive immutable prospective observation receipt (canonical)
        if: github.event_name == 'schedule' && steps.scan.outcome == 'success' && env.PROSPECTIVE_STATE_MODE == 'canonical'
        run: uv run --no-sync python -m scripts.prospective_state_archive --receipt prospective_receipt.json --out prospective_state_receipt.json
      - name: Upload prospective metadata receipt
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: prospective-${{ env.SCAN_MARKET }}-${{ github.run_id }}
          path: |
            prospective_receipt.json
            prospective_state_receipt.json
          if-no-files-found: ignore
          retention-days: 14
  pages:
    needs: scan
    if: always() && needs.scan.outputs.pages_ready == 'true'
    # Shared with the manual production publication so Pages deploys never race.
    concurrency:
      group: research-publication-production
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    steps:
      - name: Deploy daily research site to GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@v4
