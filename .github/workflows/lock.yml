name: Generate dependency lock
on:
  push:
    branches: ['**']  # tag pushes skip path filters; see docs/WORKFLOW_BRANCH_AUDIT.md E
    paths:
      - 'pyproject.toml'
      - '.github/workflows/lock.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - name: Resolve reproducible dependency lock
        run: uv lock
      - name: Verify lock validity
        run: uv lock --check
      - name: Commit lock on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: lock Python dependencies"
            git push origin HEAD:main
          fi
      - name: Preserve lock if push is disallowed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-uv-lock-${{ github.run_id }}
          path: uv.lock
          retention-days: 14
