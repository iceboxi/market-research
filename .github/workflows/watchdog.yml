name: EOD schedule watchdog
on:
  schedule:
    # Before the 07:40 UTC TW slot + 2h grace even with hours of GitHub delay, so it
    # judges the previous finished TW slot rather than today's not-yet-created run.
    - cron: '15 2 * * *'
  workflow_dispatch:
permissions:
  actions: read
  issues: write
  contents: read
concurrency:
  group: eod-schedule-watchdog
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Detect missing or failed scheduled scans
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.watchdog --repo "$GITHUB_REPOSITORY"
