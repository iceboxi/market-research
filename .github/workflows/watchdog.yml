name: EOD schedule watchdog
on:
  schedule:
    # A slot is judged once its 12h window closes (07:40 + 12h = 19:40 UTC), so even
    # with hours of GitHub delay this run judges the previous TW slot.
    - cron: '15 2 * * *'
  workflow_dispatch:
permissions:
  actions: read
  issues: write
  contents: read
concurrency:
  group: eod-schedule-watchdog
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Detect missing or failed scheduled scans
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.watchdog --repo "$GITHUB_REPOSITORY"
