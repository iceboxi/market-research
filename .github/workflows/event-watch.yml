name: Official disclosure watch
on:
  workflow_dispatch:
    inputs:
      bootstrap_events:
        description: "Explicit one-time migration from tracked legacy event_state"
        type: boolean
        default: false
  schedule:
    - cron: '15 12 * * 1-5'
    - cron: '30 2 * * 2-6'
permissions:
  contents: write
concurrency:
  group: official-event-watch
  cancel-in-progress: false
jobs:
  event-watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv lock --check
      - run: uv sync --extra dev --locked
      - name: Run offline validation
        run: uv run --no-sync pytest tests/test_event_watch.py tests/test_event_risk.py tests/test_event_state_store.py
      - name: Explicit migration (main dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_events == true
        run: |
          test "$GITHUB_REF" = refs/heads/main
          uv run --no-sync python -m scripts.event_watch_bootstrap --out event_watch_output
      - name: Restore canonical event baseline
        id: restore
        run: uv run --no-sync python -m scripts.event_watch_restore --out event_watch_input --receipt event_watch_output/restore_receipt.json
      - name: Collect source-grounded changes
        id: watcher
        run: uv run --no-sync python -m scripts.event_watch --config config/event_watchlist.yaml --state event_watch_input --out event_watch_output
      - name: Summarize
        if: always()
        run: |
          if [ -f event_watch_output/watch_summary.md ]; then
            cat event_watch_output/watch_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive verified events
        if: steps.restore.outcome == 'success' && steps.watcher.outcome == 'success'
        run: uv run --no-sync python -m scripts.event_watch_archive --proposed event_watch_output/proposed_state --receipt event_watch_output/state_receipt.json
      - name: Fail on incomplete source coverage after persistence
        if: steps.watcher.outcome == 'success'
        run: |
          uv run --no-sync python -c "import json,sys; d=json.load(open('event_watch_output/watch_receipt.json')); sys.exit(0 if d['status']=='complete' else 1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-event-watch-${{ github.run_id }}
          path: event_watch_output/
          retention-days: 14
          if-no-files-found: warn
