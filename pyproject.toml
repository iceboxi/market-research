[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "market-research"
version = "0.1.0"
description = "Reproducible Taiwan and US EOD screeners with interchangeable strategies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "yfinance>=0.2.55,<2",
    "PyYAML>=6,<7",
    "httpx>=0.27,<1",
    "exchange-calendars>=4.11,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
market-scan = "market_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_research"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
